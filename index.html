body{margin:0;font-family:Cairo,sans-serif;background:var(--bg);color:var(--txt)}
#app{display:flex;min-height:100vh}

main{flex:1;padding:24px;min-width:0;max-width:1100px}

.live{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:6px 14px;margin-top:10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.stat{background:var(--surf);border-radius:18px;padding:16px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.stat b{display:block;font-size:28px;color:var(--pri)}
.btn{border:0;border-radius:14px;padding:10px 16px;background:var(--pri);color:#fff;font:600 14px Cairo;cursor:pointer;margin:2px}
.btn:hover{background:var(--pri2)}.btn.g{background:var(--suc)}.btn.w{background:#25d366}.btn.d{background:var(--dan)}.btn.o{background:var(--line);color:var(--txt)}
input,select,textarea{font:400 14px Cairo;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--txt);max-width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tc{border:2px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;background:var(--surf);color:var(--txt);font:600 14px Cairo;text-align:right}
.tc.ab{border-color:var(--dan);background:color-mix(in srgb,var(--dan) 12%,var(--surf))}

#toast{position:fixed;bottom:22px;left:22px;z-index:99;display:flex;flex-direction:column;gap:8px}

function candidates(r){
  const ab=T(r.absentId),st=S.settings,p=r.period,d=r.day,em=st.emergency;
  return S.teachers.filter(t=>{
    if(t.isAbsent||t.exempt||t.id==r.absentId)return false;
    if(busy(t,d,p))return false;
    if(S.reserves.some(x=>x.date==r.date&&x.period==p&&x.substituteId==t.id))return false;
    if(t.balance>=limitOf(t)+(em?3:0))return false;
    if(p==8&&p8Count(t)>=p8LimitOf(t)+(em?1:0))return false;
    if(dayCount(t,r.date)>=(t.type=='معلم أول'?st.dailyLimitSenior:st.dailyLimit)+(em?1:0))return false;
    if(!em&&st.noBetween&&(busy(t,d,p-1)||busy(t,d,p+1)))return false;
    if(!em&&st.noAfter3&&busy(t,d,p-1)&&busy(t,d,p-2)&&busy(t,d,p-3))return false;
    if(t.exFrom&&r.date>=t.exFrom&&r.date<=(t.exTo||t.exFrom))return false;
    if(t.noPeriods&&t.noPeriods.includes(p))return false;
    if(t.noDays&&t.noDays.includes(d))return false;
    if(st.noP8Senior&&p==8&&t.type=='معلم أول')return false;
    if(!em&&st.noConsec&&S.reserves.some(x=>x.date==r.date&&x.substituteId==t.id&&Math.abs(x.period-p)==1))return false;
    if(!em&&st.maxWeekly>0&&weekCount(t,r.date)>=st.maxWeekly)return false;
    if(st.onlyPresent&&!Object.keys(t.schedule[d]||{}).length)return false;
    if(st.excludeSubjects&&st.excludeSubjects.split(/[,،]/).map(x=>x.trim()).filter(Boolean).includes(t.subject))return false;
    if(!em&&st.maxRun>0){const occ=q=>busy(t,d,q)||S.reserves.some(x=>x.date==r.date&&x.substituteId==t.id&&x.period==q);let n=1,q=p-1;while(q>=1&&occ(q)){n++;q--;}q=p+1;while(q<=8&&occ(q)){n++;q++;}if(n>st.maxRun)return false;}
    return true;
  }).sort((a,b)=>{
    if(!!a.lastResort!=!!b.lastResort)return a.lastResort?1:-1;
    const ra=a.balance/limitOf(a)||0,rb=b.balance/limitOf(b)||0;
    if(ra!=rb)return ra-rb;
    if(st.spread&&dayCount(a,r.date)!=dayCount(b,r.date))return dayCount(a,r.date)-dayCount(b,r.date);
    if(st.byLoad&&baseCount(a)!=baseCount(b))return baseCount(a)-baseCount(b);
    if(st.sameSubject!==false){const sa=a.subject==ab.subject?0:1,sb=b.subject==ab.subject?0:1;if(sa!=sb)return sa-sb;}
    if(st.gradeFirst){const g=String(r.className).split('/')[0],ga=knowsGrade(a,g)?0:1,gb=knowsGrade(b,g)?0:1;if(ga!=gb)return ga-gb;}
    if(st.knowsClass){const ka=knows(a,r.className)?0:1,kb=knows(b,r.className)?0:1;if(ka!=kb)return ka-kb;}
    return p==8&&st.balanceLast?p8Count(a)-p8Count(b):0;
  });
}
function assign(r){const c=candidates(r);if(!c.length)return false;r.substituteId=c[0].id;c[0].balance++;return true;}
function redistributeEmpty(d){let ok=0,fail=0;S.reserves.filter(r=>r.date==d&&!r.substituteId).forEach(r=>assign(r)?ok++:fail++);return{ok,fail};}
function createFor(t,d){const day=dayOf(d);
  Object.keys(t.schedule[day]||{}).forEach(p=>{
    if(!S.reserves.some(r=>r.date==d&&r.absentId==t.id&&r.period==p))
      S.reserves.push({date:d,day,period:+p,className:t.schedule[day][p],absentId:t.id,substituteId:null});});}
function distribute(){S.teachers.filter(t=>t.isAbsent).forEach(t=>createFor(t,date));

function toggleAbs(id){
  const t=T(id);t.isAbsent=!t.isAbsent;
  if(t.isAbsent){

    if(!S.absenceLog.some(x=>x.date==date&&x.teacherId==id))S.absenceLog.push({date,teacherId:id});
    createFor(t,date);

  }else{

}

/* ===== الجدول المدرسي (5×8) ===== */
let ttT='';
R.tt=()=>{
  const t=ttT?T(ttT):null,wd=dayOf(date);
  const rows=DAYS.map(d=>`<tr><th>${d}</th>${[1,2,3,4,5,6,7,8].map(p=>{
    const hasRes=S.reserves.some(r=>r.date==date&&r.day==d&&r.period==p&&(!t||r.substituteId==t.id));
    let txt,cls='';
    if(t){const c=t.schedule[d]&&t.schedule[d][p];txt=c||'';if(c)cls='b';if(hasRes){cls='y';txt='احتياط';}}
    else{const b=S.teachers.filter(x=>busy(x,d,p)).length;txt=b?`${b}<br><small>متفرغ ${S.teachers.length-b}</small>`:'';if(b)cls='b';if(hasRes)cls='y';}
    if(p==8&&cls)cls='o8';
    return `<td class="${cls}" onclick="cellModal('${d}',${p})">${txt||'+'}</td>`;}).join('')}</tr>`).join('');
  return `<div class="card"><select onchange="ttT=this.value;render()"><option value="">كل المعلمين</option>${S.teachers.map(x=>`<option value="${x.id}" ${x.id==ttT?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
  <span class="tag" style="background:#b7f0c5;color:#111">أساسية</span><span class="tag" style="background:#fff3a8;color:#111">احتياط ${date}</span><span class="tag" style="background:#ffd29a;color:#111">الحصة 8</span>

  <button class="btn g" onclick="$('xl2').click()">📥 رفع جدول (Excel)</button><input type="file" id="xl2" accept=".xlsx,.xls,.csv" hidden onchange="impXL(this.files[0]);this.value=''"><button class="btn o" onclick="pasteSched()">📋 لصق جدول مجموعة</button><button class="btn o" onclick="tplXL()">🧾 نموذج</button></div>
  <div class="card"><table class="tt"><tr><th></th>${[1,2,3,4,5,6,7,8].map(p=>`<th>${p}</th>`).join('')}</tr>${rows}</table></div>`;};
function cellModal(d,p){
  const L=S.teachers.filter(x=>busy(x,d,p)&&(!ttT||x.id==ttT)),F=S.teachers.filter(x=>!busy(x,d,p)&&(!ttT||x.id==ttT));
  openModal(`<h3>${d} — الحصة ${p}</h3>${L.map(x=>`<div>${esc(shortName(x))} <input style="width:90px" value="${esc(x.schedule[d][p])}" onchange="setCell(${x.id},'${d}',${p},this.value)"> <button class="btn d" onclick="setCell(${x.id},'${d}',${p},'')">✖</button></div>`).join('')||'<p>لا حصص أساسية هنا.</p>'}
  <hr><select id="nt">${F.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select> <input id="nc" placeholder="الصف 5/9" style="width:90px">
  <button class="btn g" onclick="setCell($('nt').value,'${d}',${p},$('nc').value)">إضافة</button><button class="btn o" onclick="closeModal()">إغلاق</button>`);}
function setCell(id,d,p,v){const t=T(id);if(!t)return;t.schedule[d]=t.schedule[d]||{};v=String(v).trim();if(v)t.schedule[d][p]=v;else delete t.schedule[d][p];save();render();cellModal(d,p);}

/* ===== بحث بالصف: من مع الصف الآن؟ ===== */
let clsD=DAYS.includes(dayOf(today()))?dayOf(today()):DAYS[0],clsP=1,clsC='';
function clsNow(){date=today();clsD=DAYS.includes(dayOf(date))?dayOf(date):DAYS[0];clsP=currentPeriod()||1;render();}
function whoTxt(d,p,c){
  const base=S.teachers.filter(t=>t.schedule[d]&&t.schedule[d][p]==c);
  return base.map(b=>{const r=S.reserves.find(x=>x.date==date&&x.day==d&&x.period==p&&x.absentId==b.id),s=r&&T(r.substituteId);
    if(!b.isAbsent)return `<b>${esc(b.name)}</b> <span class="tag">أساسي</span>`;
    return `<b>${esc(b.name)}</b> 🚫 غائب ← `+(s?`<b>${esc(s.name)}</b> <span class="tag">احتياط</span> <button class="btn w" onclick="waOne(${S.reserves.indexOf(r)})">💬</button>`:'<span style="color:var(--dan)">بلا بديل ⚠️</span>');}).join('<br>')||'—';}
R.cls=()=>{
  const cs=[...new Set(S.teachers.flatMap(t=>DAYS.flatMap(d=>Object.values(t.schedule[d]||{}))))].sort();
  const list=clsC?[clsC]:[...new Set(S.teachers.map(t=>t.schedule[clsD]&&t.schedule[clsD][clsP]).filter(Boolean))].sort();
  const free=S.teachers.filter(t=>!t.isAbsent&&!busy(t,clsD,clsP)&&!S.reserves.some(r=>r.date==date&&r.period==clsP&&r.substituteId==t.id));
  return `<div class="card"><select onchange="clsD=this.value;render()">${DAYS.map(d=>`<option ${d==clsD?'selected':''}>${d}</option>`).join('')}</select>
  <select onchange="clsP=+this.value;render()">${[1,2,3,4,5,6,7,8].map(p=>`<option value="${p}" ${p==clsP?'selected':''}>الحصة ${p}</option>`).join('')}</select>
  <input list="cl" placeholder="الصف مثل 5/9 (فارغ = كل الصفوف)" value="${esc(clsC)}" onchange="clsC=this.value.trim();render()"><datalist id="cl">${cs.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <button class="btn g" onclick="clsNow()">⏱️ الآن</button></div>
  <div class="card"><table>${list.map(c=>`<tr><td><b>${esc(c)}</b></td><td style="white-space:normal">${whoTxt(clsD,clsP,c)}</td></tr>`).join('')||'<tr><td>لا توجد حصص في هذا الوقت</td></tr>'}</table><small style="color:var(--mut)">الاحتياط معروض لتاريخ ${date}</small></div>
  <div class="card"><b>المتفرغون في هذه الحصة (${free.length}):</b><br>${free.map(t=>`<span class="tag">${esc(t.name)}</span>`).join('')}</div>`;};

function tModal(id){const t=T(id);
  openModal(`<h3>${esc(t.name)}</h3>
  <label>الاسم <input id="m_n" value="${esc(t.name)}"></label><br><label>التخصص <input id="m_s" value="${esc(t.subject)}"></label>
  <select id="m_t"><option ${t.type=='معلم'?'selected':''}>معلم</option><option ${t.type=='معلم أول'?'selected':''}>معلم أول</option></select><br>
  <label>سقف الاحتياط <input id="m_l" type="number" style="width:80px" value="${limitOf(t)}"></label> <label>سقف الحصة 8 <input id="m_8" type="number" style="width:70px" value="${p8LimitOf(t)}"></label><br>
  <label><input type="checkbox" id="m_e" ${t.exempt?'checked':''}> معفى من الاحتياط</label><br>إعفاء مؤقت من <input type="date" id="m_f" value="${t.exFrom||''}"> إلى <input type="date" id="m_x" value="${t.exTo||''}"><br>
  <label><input type="checkbox" id="m_r" ${t.lastResort?'checked':''}> آخر خيار (لا يُرشَّح إلا عند عدم وجود غيره)</label><br>
  <label>حصص ممنوعة (مثل 1,8) <input id="m_p" value="${(t.noPeriods||[]).join(',')}" style="width:100px"></label><br>
  أيام ممنوعة: ${DAYS.map(d=>`<label><input type="checkbox" class="m_d" value="${d}" ${(t.noDays||[]).includes(d)?'checked':''}>${d}</label>`).join(' ')}<br><br>
  <button class="btn g" onclick="saveT(${id})">حفظ</button><button class="btn o" onclick="closeModal()">إغلاق</button>`);}
function saveT(id){const t=T(id);t.name=$('m_n').value||t.name;t.subject=$('m_s').value;t.type=$('m_t').value;t.customLimit=+$('m_l').value;t.p8Limit=+$('m_8').value;
  t.exempt=$('m_e').checked;t.exFrom=$('m_f').value;t.exTo=$('m_x').value;t.lastResort=$('m_r').checked;t.noPeriods=$('m_p').value.split(/[,،\s]+/).map(Number).filter(Boolean);
  t.noDays=[...document.querySelectorAll('.m_d:checked')].map(x=>x.value);save();closeModal();render();toast('تم حفظ القيود');}
function setLimit(id,v){T(id).customLimit=v===''?null:+v;save();render();}
function autoQuota(){const mx=Math.max(1,...S.teachers.map(baseCount));
  S.teachers.forEach(t=>{const k=.4+.6*(mx-baseCount(t))/mx;t.customLimit=Math.max(1,Math.round(S.settings.fullQuota*k*(t.type=='معلم أول'?S.settings.seniorFactor:1)));});
  save();render();toast('تم احتساب الأنصبة: الأقل حصصاً ← نصاب أكبر');}
function resetQuota(){S.teachers.forEach(t=>t.customLimit=null);save();render();toast('أُعيدت الأنصبة الافتراضية');}

function render(keepFocus){
  try{
    $('side').innerHTML=`<h1>${THICON[S.theme]||'🏫'} ${esc(S.labels.platform)}</h1>`+PAGES.map(([k,v])=>`<button class="nav ${page==k?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
    if(keepFocus){const pos=$('q')?.selectionStart;$('main').innerHTML=R[page]()+foot();const e=$('q');if(e){e.focus();e.setSelectionRange(pos,pos);}}
    else $('main').innerHTML=R[page]()+foot();
  }catch(e){$('main').innerHTML='<div class="card">حدث خطأ أثناء عرض الصفحة: '+esc(e.message)+'</div>';}
}
function go(p){page=p;q='';render();scrollTo(0,0);}

function importRows(rows){
  rows=rows.map(r=>r.map(x=>String(x??'').trim())).filter(r=>r.some(Boolean));
  if(!rows.length)return 0;
  const h=rows[0],iN=h.indexOf('الاسم'),iD=h.indexOf('اليوم'),iP=h.indexOf('الحصة'),iC=h.indexOf('الصف');
  const nid=()=>Math.max(0,...S.teachers.map(t=>t.id))+1;let n=0;
  if(iN>=0&&iD>=0&&iP>=0&&iC>=0){
    rows.slice(1).forEach(r=>{const t=S.teachers.find(x=>x.name==r[iN]);if(!t||!DAYS.includes(r[iD])||!+r[iP])return;
      t.schedule[r[iD]]=t.schedule[r[iD]]||{};if(r[iC])t.schedule[r[iD]][+r[iP]]=r[iC];else delete t.schedule[r[iD]][+r[iP]];n++;});
    return n;}
  rows.forEach((c,i)=>{if(i==0&&c[0]=='الاسم')return;
    const hasS=c.slice(4,9).some(Boolean),sch={};
    DAYS.forEach((d,k)=>{sch[d]={};(c[4+k]||'').split(/\s+/).filter(Boolean).forEach(x=>{const[p,k2]=x.split(':');if(p&&k2)sch[d][+p]=k2;});});
    const ex=S.teachers.find(t=>t.name==c[0]);
    if(ex){if(c[1])ex.subject=c[1];if(c[2])ex.type=c[2];if(c[3])ex.phone=c[3];if(hasS)ex.schedule=sch;}
    else S.teachers.push({id:nid(),name:c[0],subject:c[1]||'غير محدد',type:c[2]||'معلم',phone:c[3]||'',schedule:hasS?sch:{},balance:0,isAbsent:false,exempt:false,customLimit:null});
    n++;});
  return n;}

  const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});
    const n=importRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}));save();render();toast(`تمت معالجة ${n} سجل`,n?'ok':'warn');}

function anData(){
  const top=(f,n=5)=>S.teachers.map(t=>[t,f(t)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,n);
  const per=[1,2,3,4,5,6,7,8].map(p=>{const bs=S.teachers.reduce((a,t)=>a+DAYS.filter(d=>busy(t,d,p)).length,0);
    return{p,base:Math.round(bs/5),free:Math.round((S.teachers.length*5-bs)/5),rs:S.reserves.filter(r=>r.period==p).length,un:S.reserves.filter(r=>r.period==p&&!r.substituteId).length};});
  const p8=S.reserves.filter(r=>r.period==8).length,cap=S.teachers.reduce((a,t)=>a+Math.max(0,p8LimitOf(t)-p8Count(t)),0),full=S.teachers.filter(t=>p8Count(t)>=p8LimitOf(t)).length;
  return{takers:top(t=>t.balance),absent:top(absCount),p8top:top(p8Count),per,p8,cap,full};}

/* ===== Google Drive: حفظ تلقائي ===== */
let dTok=null,dTimer=null,dWarned=false;
const dH=()=>({Authorization:'Bearer '+dTok});
function driveQueue(){if(!S||!S.drive||!S.drive.auto)return;clearTimeout(dTimer);
  dTimer=setTimeout(()=>{if(dTok)driveSave(true);else if(!dWarned){dWarned=true;toast('الحفظ على Drive متوقف: اربط الحساب من لوحة التحكم','warn');}},4000);}
function driveAuth(cb){if(!S.drive.clientId)return toast('أدخل Client ID أولاً','err');
  const go=()=>google.accounts.oauth2.initTokenClient({client_id:S.drive.clientId,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>{if(r.error)return toast('فشل تسجيل الدخول: '+r.error,'err');dTok=r.access_token;dWarned=false;cb&&cb();}}).requestAccessToken();
  if(window.google&&google.accounts)return go();
  const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.onload=go;sc.onerror=()=>toast('تعذّر تحميل خدمة Google','err');document.head.appendChild(sc);}
function driveConnect(){driveAuth(()=>driveSave(false));}
async function driveFind(){const r=await fetch('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+encodeURIComponent("name='masaa-v3-backup.json' and trashed=false"),{headers:dH()});
  const j=await r.json();return j.files&&j.files[0]?j.files[0].id:'';}
async function driveSave(quiet){try{const d=S.drive;if(!d.fileId)d.fileId=await driveFind();
    const meta={name:'masaa-v3-backup.json'};if(!d.fileId&&d.folderId)meta.parents=[d.folderId];
    const bd='b'+Date.now(),body=`--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({...S,sb:undefined})}\r\n--${bd}--`;
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files'+(d.fileId?'/'+d.fileId:'')+'?uploadType=multipart',{method:d.fileId?'PATCH':'POST',headers:{...dH(),'Content-Type':'multipart/related; boundary='+bd},body});
    if(r.status==401){dTok=null;return quiet?toast('انتهت جلسة Drive — اربط من جديد','warn'):driveAuth(()=>driveSave(false));}
    if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();d.fileId=j.id;d.last=new Date().toLocaleString('ar');
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    if(!quiet){toast('☁️ تم الحفظ على Drive');render();}}catch(e){toast('فشل الحفظ على Drive: '+e.message,'err');}}
async function driveLoad(){if(!dTok)return driveAuth(driveLoad);
  try{const d=S.drive;if(!d.fileId)d.fileId=await driveFind();if(!d.fileId)return toast('لا توجد نسخة على Drive','warn');
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${d.fileId}?alt=media`,{headers:dH()});if(!r.ok)throw new Error('HTTP '+r.status);
    if(!confirm('سيتم استبدال بياناتك الحالية بنسخة Drive. متابعة؟'))return;
    const n=await r.json(),keep={clientId:d.clientId,fileId:d.fileId,folderId:d.folderId,auto:d.auto};
    const sbk=S.sb;S=n;S.sb=Object.assign({},defaults().sb,sbk);S.settings=Object.assign({},defaults().settings,S.settings);S.drive=Object.assign({},defaults().drive,S.drive,keep);
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}setTheme(S.theme||'light');toast('تم الاسترجاع من Drive');}catch(e){toast('فشل الاسترجاع: '+e.message,'err');}}

async function sbSave(quiet,retry){try{const{sb,drive,...rest}=S;
  const r=await fetch(sbBase()+'/rest/v1/masaa_state?on_conflict=id',{method:'POST',headers:{...sbH(),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:S.sb.rowId||'main',data:rest,updated_at:new Date().toISOString()})});
  if(r.status==401&&!retry&&await sbRefresh())return sbSave(quiet,true);
  if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+' '+t.slice(0,120));}
  S.sb.last=new Date().toLocaleString('ar');sbPersist();if(!quiet){toast('🗄️ تم الحفظ في Supabase');render();}}
  catch(e){toast('فشل الحفظ في Supabase: '+e.message,'err');}}
async function sbLoad(isAuto = false){
  if(!S.sb.url || !S.sb.key){ if(!isAuto) toast('أدخل رابط المشروع والمفتاح أولاً','warn'); return; }
  try{
    const r=await fetch(sbBase()+'/rest/v1/masaa_state?select=data,updated_at&id=eq.'+encodeURIComponent(S.sb.rowId||'main'),{headers:sbH()});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!j.length){ if(!isAuto) toast('لا توجد نسخة محفوظة بهذا الاسم','warn'); return; }
    
    if(!isAuto){
      if(!confirm('سيتم استبدال بياناتك الحالية بنسخة Supabase المحفوظة في '+new Date(j[0].updated_at).toLocaleString('ar')+'. متابعة؟'))return;
    }
    
    const sbk=S.sb,dk=S.drive;S=j[0].data;
    S.sb=sbk;S.drive=Object.assign({},defaults().drive,dk);S.settings=Object.assign({},defaults().settings,S.settings);
    sbPersist();setTheme(S.theme||'light');
    if(!isAuto) toast('تم الاسترجاع من Supabase'); else render();
  }catch(e){
    if(!isAuto) toast('فشل الاسترجاع: '+e.message,'err');
  }
}

/* ===== INIT ===== */
window.onerror=(m,s,l)=>{if(/^Script error/i.test(String(m))&&!l){console.warn('تم تجاهل خطأ خارجي:',m);return true;}toast('خطأ: '+m+' (سطر '+l+')','err');};
try{load();clsP=currentPeriod()||1;document.documentElement.dataset.th=S.theme||'light';render();sbBoot();}
catch(e){document.body.innerHTML='<div style="padding:30px;font-family:sans-serif">تعذّر تشغيل المنصة: '+e.message+'</div>';}
</script>
