<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة المسعى</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ===== THEMES ===== */
:root{--bg:#f5f5f7;--surf:#fff;--txt:#1d1d1f;--pri:#0071e3;--pri2:#0058b8;--suc:#34c759;--warn:#ff9f0a;--dan:#ff3b30;--mut:#6e6e73;--line:#e3e3e8}
[data-th=dark]{--bg:#000;--surf:#1c1c1e;--txt:#f5f5f7;--pri:#0a84ff;--mut:#98989d;--line:#2c2c2e;--hero:linear-gradient(135deg,#0a84ff,#7c3aed)}
[data-th=edu]{--pri:#2d7a3e;--bg:#f5f7f1;--hero:linear-gradient(135deg,#2d7a3e,#65a30d)}
[data-th=royal]{--pri:#1e3a8a;--bg:#f0f4fa;--hero:linear-gradient(135deg,#1e3a8a,#7c3aed)}
[data-th=warm]{--pri:#c2410c;--bg:#fdf6f0;--hero:linear-gradient(135deg,#c2410c,#f59e0b)}
[data-th=board]{--bg:#1f2d27;--surf:#2a3b33;--txt:#f1f5ee;--pri:#b7791f;--pri2:#92600f;--mut:#a9b9ae;--line:#3d5147;--hero:linear-gradient(135deg,#2f5d46,#1f3b2e)}
[data-th=ocean]{--bg:#eef7f9;--pri:#0e7490;--pri2:#155e75;--hero:linear-gradient(135deg,#0891b2,#2563eb)}
[data-th=library]{--bg:#f7f1e6;--surf:#fffaf0;--txt:#3b2a1a;--pri:#8b5e34;--pri2:#6f4a28;--mut:#8a7560;--line:#e6d9c3;--hero:linear-gradient(135deg,#8b5e34,#c08457)}
[data-th=alert]{--bg:#fff5f3;--pri:#dc2626;--pri2:#b91c1c;--hero:linear-gradient(135deg,#dc2626,#f59e0b)}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,sans-serif;background:var(--bg);color:var(--txt)}
#app{display:flex;min-height:100vh}
aside{width:270px;padding:20px 14px;background:color-mix(in srgb,var(--surf) 80%,transparent);backdrop-filter:blur(18px);border-left:1px solid var(--line);position:sticky;top:0;height:100vh;flex-shrink:0}
aside h1{font-size:20px;margin:0 8px 18px;font-weight:800;color:var(--pri)}
.nav{display:block;width:100%;text-align:right;padding:11px 14px;margin-bottom:4px;border:0;border-radius:14px;background:none;color:var(--txt);font:600 15px Cairo;cursor:pointer}
.nav.on{background:var(--pri);color:#fff}
main{flex:1;padding:24px;min-width:0;max-width:1100px}
.card{background:var(--surf);border-radius:22px;padding:18px;box-shadow:0 4px 24px rgba(0,0,0,.06);margin-bottom:16px;overflow-x:auto}
.hero{border-radius:24px;padding:28px;color:#fff;background:var(--hero,linear-gradient(135deg,#7c3aed,#ec4899));margin-bottom:16px}
.hero h2{margin:0 0 6px;font-size:28px;font-weight:800}
.live{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:6px 14px;margin-top:10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.stat{background:var(--surf);border-radius:18px;padding:16px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.stat b{display:block;font-size:28px;color:var(--pri)}
.btn{border:0;border-radius:14px;padding:10px 16px;background:var(--pri);color:#fff;font:600 14px Cairo;cursor:pointer;margin:2px}
.btn:hover{background:var(--pri2)}.btn.g{background:var(--suc)}.btn.w{background:#25d366}.btn.d{background:var(--dan)}.btn.o{background:var(--line);color:var(--txt)}
input,select,textarea{font:400 14px Cairo;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--txt);max-width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tc{border:2px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;background:var(--surf);color:var(--txt);font:600 14px Cairo;text-align:right}
.tc.ab{border-color:var(--dan);background:color-mix(in srgb,var(--dan) 12%,var(--surf))}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--line);margin-left:4px}
#toast{position:fixed;bottom:22px;left:22px;z-index:99;display:flex;flex-direction:column;gap:8px}
#toast div{padding:12px 18px;border-radius:14px;color:#fff;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:90}.mc{background:var(--surf);border-radius:22px;padding:20px;max-width:92vw;max-height:88vh;overflow:auto;min-width:290px}.tt td{text-align:center;cursor:pointer;min-width:58px;border:1px solid var(--line);line-height:1.2}.tt .b{background:#b7f0c5;color:#111}.tt .y{background:#fff3a8;color:#111}.tt .o8{background:#ffd29a;color:#111}
@media(max-width:800px){#app{flex-direction:column}aside{width:100%;height:auto;position:static;display:flex;overflow-x:auto;gap:4px;padding:10px}aside h1{display:none}.nav{width:auto;white-space:nowrap}main{padding:14px}}
</style>
</head>
<body>
<div id="app"><aside id="side"></aside><main id="main"></main></div>
<div id="toast"></div><div id="modal"></div>
<script>
/* ===== CONSTANTS ===== */
const KEY='masaa-v3';
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const ALLDAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const PAGES=[['home','🏫 الرئيسية'],['abs','🚫 الغياب'],['dist','🔄 توزيع الاحتياط'],['tt','🗓️ الجدول المدرسي'],['cls','🔎 بحث بالصف'],['teach','👨‍🏫 المعلمون'],['stats','📊 الإحصائيات'],['an','📈 تحليل الحصص'],['set','⚙️ لوحة التحكم']];
const THEMES={light:'🍎 فاتح',dark:'🌙 داكن',edu:'📚 تربوي أخضر',royal:'🏛️ ملكي',warm:'☀️ دافئ',board:'🧑‍🏫 السبورة',ocean:'🌊 المحيط',library:'📖 المكتبة',alert:'⏱️ الاحتياط والطوارئ'};

/* ===== INITIAL DATA ===== */
// كل مجموعة: [التخصص, أسماء...]، والاسم الذي يبدأ بـ * هو "معلم أول"
const RAW=[
['التربية الإسلامية','يحيى عبدالله سليمان السابعي','علي الغساني','بدر بطي راشد القاسمي','علي الشيادي','احمد محمد عبيد السعدي','سلطان ناصر سيف الربيعي','سمير خميس غابش الخميسى'],
['اللغة العربية','ناصر الغذائي','نبيل المقيالي','عامر سليمان حميد السعيدى','شهاب العلوي','محمد عامر فاضل السعدى','ابراهيم القرني','سلطان الصالحي','ماجد سعيد على الشحى','عمر ناصر سالم المسعودي','طاهر رامس حمود القعنونى','ابراهيم مصبح كوهيه السعدي'],
['اللغة الإنجليزية','سعيد محمد على الغذائي','حمد صالح حمدان البلوشى','احمد حميد سيف هاشل المخمرى','سيف الدين بن يونس الحاجي','طلال القادري','موسى على سليمان الغافرى','ماجد البلوشي'],
['الرياضيات','محمد سالم على البلوشي','سعيد مبارك عبدالله البلوشي','سلطان حميد راشد الغافرى','شريف الصالحي','عمرو عبدالعالم محمد محمود','مروان العادل','محمد محمود احمد محمد','عمرو عبدالعال محمد محمود','احمد ناجي محمد عرفات','حكيم مسعود','صلاح زين السيد','وائل محسن','أميل منير'],
['العلوم','عبدالعزيز الغداني','عبدالله الخميسي','عمار راشد صغير سعيد الصالحي','فريد المقبالي','مخلد سالم هاشل سيف العوادي','سعد السعدي','سالم محمد حمد المجيهولي'],
['الدراسات الاجتماعية','بدر سيف خميس الغافري','ماجد سعيد هلال الحوسنى','فوزي عبدالله سعيد الصالحي','ماجد الجنبي','محمد القريني','بدر زايد سيف الصالحي'],
['الفنون التشكيلية','محمد شاكر','*عبدالعزيز محمد صالح البلوشى'],
['المهارات الموسيقية','هشام صالح منجود صالح'],
['الرياضة المدرسية','ياسر صغير مبارك الرشيدى','جاسم البلوشي'],
['تقنية المعلومات','*ناصر سعيد صالح المسعودي','حمد محمد خميس البادي'],
['المهارات الحياتية','*عادل ناعم راشد الشيدي'],
['الكيمياء','ناصر سيف سعيد المقيالي'],
['الأحياء','وضاح راشد بريك الحوسنى'],
['غير محدد','معاذ محمد سالم الجهوري','عبدالعزيز عبدالله سيف الجهوري','عدنان علي محمد المرزوقي','بدر الرشيدي']
];
// جدول تجريبي عشوائي ثابت (seeded) ليعمل التوزيع فور التشغيل؛ استبدله بجداولك عبر "لصق CSV"
function demoSchedule(seed){
  let s=seed*9301+49297;const r=()=>(s=(s*9301+49297)%233280)/233280;
  const sch={};
  DAYS.forEach(d=>{sch[d]={};for(let p=1;p<=8;p++){if(r()<(p==8?.15:.5))sch[d][p]=(5+Math.floor(r()*5))+'/'+(1+Math.floor(r()*9));}});
  return sch;
}
function initialTeachers(){
  let id=0;const out=[];
  RAW.forEach(g=>g.slice(1).forEach(n=>{id++;const sr=n[0]=='*';
    out.push({id,name:sr?n.slice(1):n,subject:g[0],type:sr?'معلم أول':'معلم',phone:'',schedule:demoSchedule(id),balance:0,isAbsent:false,exempt:false,customLimit:null});}));
  return out;
}

/* ===== STATE ===== */
const today=()=>new Date().toISOString().slice(0,10);
let S,page='home',date=today(),q='';
function defaults(){return{teachers:initialTeachers(),reserves:[],
  settings:{fullQuota:25,seniorFactor:0.25,dailyLimit:2,dailyLimitSenior:1,noBetween:true,noAfter3:true,balanceLast:true,noP8Senior:false,noConsec:true,maxWeekly:0,byLoad:true,knowsClass:true,sameSubject:true,spread:true,emergency:false,p8Quota:3,maxRun:0,onlyPresent:false,excludeSubjects:'',gradeFirst:false},
  theme:'light',times:{1:['08:00','08:45'],2:['09:00','09:45'],3:['10:00','10:45'],4:['11:00','11:45'],5:['12:00','12:45'],6:['13:00','13:45'],7:['14:00','14:45'],8:['15:00','15:45']},
  school:{name:'مدرسة المسعى'},labels:{platform:'منصة المسعى'},absenceLog:[],drive:{clientId:'',folderId:'',fileId:'',auto:false,last:''}};}
function load(){try{const d=localStorage.getItem(KEY);S=d?JSON.parse(d):defaults();S.settings=Object.assign({},defaults().settings,S.settings);S.drive=Object.assign({},defaults().drive,S.drive);}catch(e){S=defaults();}}
function save(){driveQueue();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('تعذّر الحفظ في المتصفح','err');}}

/* ===== UTILITIES ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=id=>S.teachers.find(t=>t.id==id);
const dayOf=d=>ALLDAYS[new Date(d+'T12:00:00').getDay()];
function toast(m,k='ok'){const e=document.createElement('div');e.textContent=m;e.style.background=k=='err'?'var(--dan)':k=='warn'?'var(--warn)':'var(--suc)';$('toast').appendChild(e);setTimeout(()=>e.remove(),3500);}
// الاسم المختصر: أول كلمة + آخر كلمة (للجدول المدرسي فقط)، ويعود للكامل عند التكرار
function shortName(t){const f=n=>{const w=n.trim().split(/\s+/);return w.length>1?w[0]+' '+w[w.length-1]:n;};
  const s=f(t.name);return S.teachers.some(o=>o.id!=t.id&&f(o.name)==s)?t.name:s;}
const busy=(t,d,p)=>!!(t.schedule[d]&&t.schedule[d][p]);
const limitOf=t=>t.customLimit??Math.round(S.settings.fullQuota*(t.type=='معلم أول'?S.settings.seniorFactor:1));
const baseCount=t=>DAYS.reduce((a,d)=>a+Object.keys(t.schedule[d]||{}).length,0);
const p8Count=t=>S.reserves.filter(r=>r.substituteId==t.id&&r.period==8).length;
const dayCount=(t,d)=>S.reserves.filter(r=>r.date==d&&r.substituteId==t.id).length;
const weekKey=x=>{const z=new Date(x+'T12:00:00');z.setDate(z.getDate()-z.getDay());return z.toDateString();};
const weekCount=(t,d)=>S.reserves.filter(r=>r.substituteId==t.id&&weekKey(r.date)==weekKey(d)).length;
const knows=(t,c)=>DAYS.some(d=>Object.values(t.schedule[d]||{}).includes(c));
function currentPeriod(){const n=new Date(),m=n.getHours()*60+n.getMinutes();
  for(const p in S.times){const[a,b]=S.times[p].map(x=>+x.slice(0,2)*60+ +x.slice(3));if(m>=a&&m<=b)return +p;}return 0;}

/* ===== ACTIONS (التوزيع والغياب) ===== */
// المرشحون وفق القواعد الصارمة
function candidates(r){
  const ab=T(r.absentId),st=S.settings,p=r.period,d=r.day,em=st.emergency;
  return S.teachers.filter(t=>{
    if(t.isAbsent||t.exempt||t.id==r.absentId)return false;
    if(busy(t,d,p))return false;
    if(S.reserves.some(x=>x.date==r.date&&x.period==p&&x.substituteId==t.id))return false;
    if(t.balance>=limitOf(t)+(em?3:0))return false;
    if(p==8&&p8Count(t)>=p8LimitOf(t)+(em?1:0))return false;
    if(dayCount(t,r.date)>=(t.type=='معلم أول'?st.dailyLimitSenior:st.dailyLimit)+(em?1:0))return false;
    if(!em&&st.noBetween&&(busy(t,d,p-1)||busy(t,d,p+1)))return false; // قبل/بعد/محصورة
    if(!em&&st.noAfter3&&busy(t,d,p-1)&&busy(t,d,p-2)&&busy(t,d,p-3))return false;
    if(t.exFrom&&r.date>=t.exFrom&&r.date<=(t.exTo||t.exFrom))return false;
    if(t.noPeriods&&t.noPeriods.includes(p))return false;
    if(t.noDays&&t.noDays.includes(d))return false;
    if(st.noP8Senior&&p==8&&t.type=='معلم أول')return false;
    if(!em&&st.noConsec&&S.reserves.some(x=>x.date==r.date&&x.substituteId==t.id&&Math.abs(x.period-p)==1))return false;
    if(!em&&st.maxWeekly>0&&weekCount(t,r.date)>=st.maxWeekly)return false;
    if(st.onlyPresent&&!Object.keys(t.schedule[d]||{}).length)return false;
    if(st.excludeSubjects&&st.excludeSubjects.split(/[,،]/).map(x=>x.trim()).filter(Boolean).includes(t.subject))return false;
    if(!em&&st.maxRun>0){const occ=q=>busy(t,d,q)||S.reserves.some(x=>x.date==r.date&&x.substituteId==t.id&&x.period==q);let n=1,q=p-1;while(q>=1&&occ(q)){n++;q--;}q=p+1;while(q<=8&&occ(q)){n++;q++;}if(n>st.maxRun)return false;}
    return true;
  }).sort((a,b)=>{
    if(!!a.lastResort!=!!b.lastResort)return a.lastResort?1:-1;
    const ra=a.balance/limitOf(a)||0,rb=b.balance/limitOf(b)||0;
    if(ra!=rb)return ra-rb;
    if(st.spread&&dayCount(a,r.date)!=dayCount(b,r.date))return dayCount(a,r.date)-dayCount(b,r.date);
    if(st.byLoad&&baseCount(a)!=baseCount(b))return baseCount(a)-baseCount(b);
    if(st.sameSubject!==false){const sa=a.subject==ab.subject?0:1,sb=b.subject==ab.subject?0:1;if(sa!=sb)return sa-sb;}
    if(st.gradeFirst){const g=String(r.className).split('/')[0],ga=knowsGrade(a,g)?0:1,gb=knowsGrade(b,g)?0:1;if(ga!=gb)return ga-gb;}
    if(st.knowsClass){const ka=knows(a,r.className)?0:1,kb=knows(b,r.className)?0:1;if(ka!=kb)return ka-kb;}
    return p==8&&st.balanceLast?p8Count(a)-p8Count(b):0;
  });
}
function assign(r){const c=candidates(r);if(!c.length)return false;r.substituteId=c[0].id;c[0].balance++;return true;}
// إعادة توزيع كل الحصص الشاغرة في تاريخ معيّن
function redistributeEmpty(d){let ok=0,fail=0;S.reserves.filter(r=>r.date==d&&!r.substituteId).forEach(r=>assign(r)?ok++:fail++);return{ok,fail};}
function createFor(t,d){const day=dayOf(d);
  Object.keys(t.schedule[day]||{}).forEach(p=>{
    if(!S.reserves.some(r=>r.date==d&&r.absentId==t.id&&r.period==p))
      S.reserves.push({date:d,day,period:+p,className:t.schedule[day][p],absentId:t.id,substituteId:null});});}
function distribute(){S.teachers.filter(t=>t.isAbsent).forEach(t=>createFor(t,date));
  const r=redistributeEmpty(date);save();render();
  toast(`تم توزيع ${r.ok} حصة`+(r.fail?` — تعذّر ${r.fail}`:''),r.fail?'warn':'ok');}
function toggleAbs(id){
  const t=T(id);t.isAbsent=!t.isAbsent;
  if(t.isAbsent){
    // 1) إلغاء حصص احتياطه كبديل
    const mine=S.reserves.filter(r=>r.date==date&&r.substituteId==id);
    mine.forEach(r=>{r.substituteId=null;t.balance=Math.max(0,t.balance-1);});
    if(!S.absenceLog.some(x=>x.date==date&&x.teacherId==id))S.absenceLog.push({date,teacherId:id});
    // 2) إنشاء حصصه هو ثم إعادة توزيع كل الشاغر
    createFor(t,date);
    const r=redistributeEmpty(date);
    toast(mine.length?`تم إلغاء ${mine.length} حصة وإعادة توزيعها`+(r.fail?` (تعذّر ${r.fail})`:''):'تم تسجيل الغياب',r.fail?'warn':'ok');
  }else{
    // عودة المعلم: حذف حصصه وخفض أرصدة البدلاء
    const rm=S.reserves.filter(r=>r.date==date&&r.absentId==id);
    rm.forEach(r=>{const s=T(r.substituteId);if(s)s.balance=Math.max(0,s.balance-1);});
    S.reserves=S.reserves.filter(r=>!(r.date==date&&r.absentId==id));
    toast(`عاد المعلم — حُذفت ${rm.length} حصة`);
  }
  save();render();
}
function setSub(i,v){const r=S.reserves[i],o=T(r.substituteId),n=v?T(v):null;
  if(n){const c=conflictOf(n,r);
    if(c.length&&!confirm('⚠️ تنبيه تعارض:\n'+c.join('\n')+'\n\nهل تريد التعيين اليدوي رغم ذلك؟')){render();return;}
    if(c.length)toast('عُيّن يدوياً مع وجود تعارض: '+c[0],'warn');}
  if(o)o.balance=Math.max(0,o.balance-1);if(n)n.balance++;r.substituteId=n?n.id:null;save();render();}
// كشف التعارض: حصة أساسية أو احتياط آخر في نفس الوقت، أو غياب المعلم
function conflictOf(t,r){const c=[];
  if(t.isAbsent)c.push('المعلم غائب');
  if(busy(t,r.day,r.period))c.push(`لديه حصة أساسية (${t.schedule[r.day][r.period]}) في الحصة ${r.period}`);
  const ri=r.i!==undefined?r.i:S.reserves.indexOf(r);
  if(S.reserves.some((x,j)=>j!==ri&&x.date==r.date&&x.period==r.period&&x.substituteId==t.id))c.push('لديه احتياط آخر في نفس الحصة');
  return c;}
function rowWarn(r){const t=T(r.substituteId),c=t?conflictOf(t,r):[];return c.length?`<span class="tag" style="background:var(--warn);color:#fff" title="${esc(c.join(' | '))}">⚠️ تعارض</span> `:'';}
function delRes(i){const r=S.reserves[i],s=T(r.substituteId);if(s)s.balance=Math.max(0,s.balance-1);S.reserves.splice(i,1);save();render();}
function todayRes(){return S.reserves.map((r,i)=>({...r,i})).filter(r=>r.date==date).sort((a,b)=>a.absentId-b.absentId||a.period-b.period);}

/* ===== PDF عبر html2pdf.js ===== */
function genPDF(share){
  const L=todayRes();if(!L.length)return toast('لا توجد حصص لهذا اليوم','warn');
  if(typeof html2pdf=='undefined')return toast('مكتبة PDF لم تُحمَّل — تحقق من الاتصال','err');
  const by={};L.forEach(r=>(by[r.absentId]=by[r.absentId]||[]).push(r));
  let h=`<div dir="rtl" style="font-family:Cairo,sans-serif;padding:14px;color:#111;background:#fff;width:720px">
  ${pdfHead('جدول حصص الاحتياط',date+' — '+dayOf(date))}`;
  Object.keys(by).forEach(id=>{const a=T(id);
    h+=`<div style="border:1px solid #ccc;border-radius:12px;padding:10px;margin-bottom:12px;page-break-inside:avoid">
    <b>الغائب: ${esc(a.name)}</b> <span style="color:#666">(${esc(a.subject)})</span>
    <table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:13px"><tr style="background:#eef3fb"><th style="border:1px solid #ccc;padding:5px">الحصة</th><th style="border:1px solid #ccc;padding:5px">الصف</th><th style="border:1px solid #ccc;padding:5px">البديل</th><th style="border:1px solid #ccc;padding:5px">التخصص</th></tr>`;
    by[id].forEach(r=>{const s=T(r.substituteId);
      h+=`<tr><td style="border:1px solid #ccc;padding:5px;text-align:center">${r.period}${r.period==8?' ⭐':''}</td><td style="border:1px solid #ccc;padding:5px;text-align:center">${esc(r.className)}</td><td style="border:1px solid #ccc;padding:5px">${s?esc(s.name):'—'}</td><td style="border:1px solid #ccc;padding:5px">${s?esc(s.subject):'—'}</td></tr>`;});
    h+='</table></div>';});
  h+=`<div style="text-align:center;color:#555;font-size:12px">إجمالي الحصص: ${L.length} — الغائبون: ${Object.keys(by).length} — الحصة الأخيرة: ${L.filter(r=>r.period==8).length}</div>${pdfFoot()}</div>`;
  const el=document.createElement('div');el.style.cssText='position:absolute;top:0;left:0;z-index:-1;background:#fff';el.innerHTML=h;document.body.appendChild(el);
  const name=`جدول_الاحتياط_${date}.pdf`;
  html2pdf().set({margin:8,filename:name,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}})
    .from(el.firstElementChild).outputPdf('blob').then(b=>{el.remove();pdfFile=null;if(share)pdfReady(b,name);else{pdfReady(b,name);dlPdf();}}).catch(e=>{el.remove();toast('فشل PDF: '+e.message,'err');});
}

  return `<div class="card"><select onchange="clsD=this.value;render()">${DAYS.map(d=>`<option ${d==clsD?'selected':''}>${d}</option>`).join('')}</select>
  <select onchange="clsP=+this.value;render()">${[1,2,3,4,5,6,7,8].map(p=>`<option value="${p}" ${p==clsP?'selected':''}>الحصة ${p}</option>`).join('')}</select>

/* ===== Excel / إضافة فردية / مشاركة PDF ===== */
function importRows(rows){
  rows=rows.map(r=>r.map(x=>String(x??'').trim())).filter(r=>r.some(Boolean));
  if(!rows.length)return 0;
  const h=rows[0],iN=h.indexOf('الاسم'),iD=h.indexOf('اليوم'),iP=h.indexOf('الحصة'),iC=h.indexOf('الصف');
  const nid=()=>Math.max(0,...S.teachers.map(t=>t.id))+1;let n=0;
  if(iN>=0&&iD>=0&&iP>=0&&iC>=0){ // صيغة طويلة: الاسم | اليوم | الحصة | الصف
    rows.slice(1).forEach(r=>{const t=S.teachers.find(x=>x.name==r[iN]);if(!t||!DAYS.includes(r[iD])||!+r[iP])return;
      t.schedule[r[iD]]=t.schedule[r[iD]]||{};if(r[iC])t.schedule[r[iD]][+r[iP]]=r[iC];else delete t.schedule[r[iD]][+r[iP]];n++;});
    return n;}
  rows.forEach((c,i)=>{if(i==0&&c[0]=='الاسم')return; // صيغة عريضة: الاسم,التخصص,الفئة,الجوال,الأحد..الخميس
    const hasS=c.slice(4,9).some(Boolean),sch={};
    DAYS.forEach((d,k)=>{sch[d]={};(c[4+k]||'').split(/\s+/).filter(Boolean).forEach(x=>{const[p,k2]=x.split(':');if(p&&k2)sch[d][+p]=k2;});});
    const ex=S.teachers.find(t=>t.name==c[0]);
    if(ex){if(c[1])ex.subject=c[1];if(c[2])ex.type=c[2];if(c[3])ex.phone=c[3];if(hasS)ex.schedule=sch;}
    else S.teachers.push({id:nid(),name:c[0],subject:c[1]||'غير محدد',type:c[2]||'معلم',phone:c[3]||'',schedule:hasS?sch:{},balance:0,isAbsent:false,exempt:false,customLimit:null});
    n++;});
  return n;}
function impXL(f){if(!f)return;if(typeof XLSX=='undefined')return toast('مكتبة Excel لم تُحمَّل — تحقق من الاتصال','err');
  const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});
    const n=importRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}));save();render();toast(`تمت معالجة ${n} سجل`,n?'ok':'warn');}
    catch(x){toast('تعذّرت قراءة الملف: '+x.message,'err');}};r.readAsArrayBuffer(f);}

/* ===== Google Drive: حفظ تلقائي ===== */
let dTok=null,dTimer=null,dWarned=false;
const dH=()=>({Authorization:'Bearer '+dTok});
function driveQueue(){if(!S||!S.drive||!S.drive.auto)return;clearTimeout(dTimer);
  dTimer=setTimeout(()=>{if(dTok)driveSave(true);else if(!dWarned){dWarned=true;toast('الحفظ على Drive متوقف: اربط الحساب من لوحة التحكم','warn');}},4000);}
function driveAuth(cb){if(!S.drive.clientId)return toast('أدخل Client ID أولاً','err');
  const go=()=>google.accounts.oauth2.initTokenClient({client_id:S.drive.clientId,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>{if(r.error)return toast('فشل تسجيل الدخول: '+r.error,'err');dTok=r.access_token;dWarned=false;cb&&cb();}}).requestAccessToken();
  if(window.google&&google.accounts)return go();
  const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.onload=go;sc.onerror=()=>toast('تعذّر تحميل خدمة Google','err');document.head.appendChild(sc);}
function driveConnect(){driveAuth(()=>driveSave(false));}
async function driveFind(){const r=await fetch('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+encodeURIComponent("name='masaa-v3-backup.json' and trashed=false"),{headers:dH()});
  const j=await r.json();return j.files&&j.files[0]?j.files[0].id:'';}
async function driveSave(quiet){try{const d=S.drive;if(!d.fileId)d.fileId=await driveFind();
    const meta={name:'masaa-v3-backup.json'};if(!d.fileId&&d.folderId)meta.parents=[d.folderId];
    const bd='b'+Date.now(),body=`--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(S)}\r\n--${bd}--`;
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files'+(d.fileId?'/'+d.fileId:'')+'?uploadType=multipart',{method:d.fileId?'PATCH':'POST',headers:{...dH(),'Content-Type':'multipart/related; boundary='+bd},body});
    if(r.status==401){dTok=null;return quiet?toast('انتهت جلسة Drive — اربط من جديد','warn'):driveAuth(()=>driveSave(false));}
    if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();d.fileId=j.id;d.last=new Date().toLocaleString('ar');
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    if(!quiet){toast('☁️ تم الحفظ على Drive');render();}}catch(e){toast('فشل الحفظ على Drive: '+e.message,'err');}}
async function driveLoad(){if(!dTok)return driveAuth(driveLoad);
  try{const d=S.drive;if(!d.fileId)d.fileId=await driveFind();if(!d.fileId)return toast('لا توجد نسخة على Drive','warn');
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${d.fileId}?alt=media`,{headers:dH()});if(!r.ok)throw new Error('HTTP '+r.status);
    if(!confirm('سيتم استبدال بياناتك الحالية بنسخة Drive. متابعة؟'))return;
    const n=await r.json(),keep={clientId:d.clientId,fileId:d.fileId,folderId:d.folderId,auto:d.auto};
    S=n;S.settings=Object.assign({},defaults().settings,S.settings);S.drive=Object.assign({},defaults().drive,S.drive,keep);
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}setTheme(S.theme||'light');toast('تم الاسترجاع من Drive');}catch(e){toast('فشل الاسترجاع: '+e.message,'err');}}

/* ===== الواجهات والشعارات والاعتمادات ===== */
const DESIGNER='أحمد بن عبدالله العلي',PRINCIPAL='الدكتور حسن بن علي البلوشي';
const THICON={light:'🍎',dark:'🌙',edu:'📚',royal:'🏛️',warm:'☀️',board:'🧑‍🏫',ocean:'🌊',library:'📖',alert:'⏱️'};
const prin=()=>S.school.principal||PRINCIPAL;
const logoAbs=(src,side)=>src?`<img src="${src}" style="position:absolute;top:14px;${side}:16px;height:64px;max-width:90px;object-fit:contain;background:rgba(255,255,255,.92);border-radius:12px;padding:4px">`:'';
const foot=()=>`<div style="text-align:center;color:var(--mut);font-size:13px;padding:14px">مدير المدرسة: ${esc(prin())} • إعداد وتصميم: ${DESIGNER}</div>`;
function setLogo(side,f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.school['logo'+side]=c.toDataURL('image/png');save();render();toast('تم رفع الشعار');};im.src=r.result;};r.readAsDataURL(f);}
const pimg=s=>s?`<img src="${s}" style="height:64px;max-width:90px;object-fit:contain">`:'<div style="width:64px"></div>';
function pdfHead(t,sub){return `<div style="display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #0071e3;padding-bottom:10px;margin-bottom:14px">${pimg(S.school.logoR)}<div style="text-align:center"><div style="font-size:22px;font-weight:800">${esc(S.school.name)}</div><div style="font-size:17px">${t}</div><div style="color:#555">${sub}</div></div>${pimg(S.school.logoL)}</div>`;}
function pdfFoot(){return `<div style="display:flex;justify-content:space-between;border-top:1px solid #ccc;margin-top:14px;padding-top:8px;font-size:12px;color:#333"><span>مدير المدرسة: ${esc(prin())}</span><span>إعداد وتصميم: ${DESIGNER}</span></div>`;}
const knowsGrade=(t,g)=>DAYS.some(d=>Object.values(t.schedule[d]||{}).some(c=>String(c).split('/')[0]==g));

/* ===== INIT ===== */
// أخطاء "Script error." بلا رقم سطر تأتي من سكربت خارجي أو من المتصفح (مثل الترجمة التلقائية) ولا تخص المنصة؛ نتجاهل عرضها
window.onerror=(m,s,l)=>{if(/^Script error/i.test(String(m))&&!l){console.warn('تم تجاهل خطأ خارجي:',m);return true;}toast('خطأ: '+m+' (سطر '+l+')','err');};
try{load();clsP=currentPeriod()||1;document.documentElement.dataset.th=S.theme||'light';render();}
catch(e){document.body.innerHTML='<div style="padding:30px;font-family:sans-serif">تعذّر تشغيل المنصة: '+e.message+'</div>';}
</script>
</body>
