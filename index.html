:root{--bg:#f5f5f7;--surf:#fff;--txt:#1d1d1f;--pri:#0071e3;--pri2:#0058b8;--suc:#34c759;--warn:#ff9f0a;--dan:#ff3b30;--mut:#6e6e73;--line:#e3e3e8}

[data-th=library]{--bg:#f7f1e6;--surf:#fffaf0;--txt:#3b2a1a;--pri:#8b5e34;--pri2:#6f4a28;--mut:#8a7560;--line:#e6d9c3;--hero:linear-gradient(135deg,#8b5e34,#c08457)}

*{box-sizing:border-box}
body{margin:0;font-family:Cairo,sans-serif;background:var(--bg);color:var(--txt)}
#app{display:flex;min-height:100vh}
aside{width:270px;padding:20px 14px;background:color-mix(in srgb,var(--surf) 80%,transparent);backdrop-filter:blur(18px);border-left:1px solid var(--line);position:sticky;top:0;height:100vh;flex-shrink:0}

.card{background:var(--surf);border-radius:22px;padding:18px;box-shadow:0 4px 24px rgba(0,0,0,.06);margin-bottom:16px;overflow-x:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}

.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--line);margin-left:4px}

</style>

/* ===== ACTIONS ===== */
function candidates(r){
  const ab=T(r.absentId),st=S.settings,p=r.period,d=r.day,em=st.emergency;
  if(st.noP1 && p===1) return []; 
  
  return S.teachers.filter(t=>{
    if(t.isAbsent||t.exempt||t.id==r.absentId)return false;
    if(t.lockedPeriods && t.lockedPeriods.includes(`${d}-${p}`)) return false; 
    if(busy(t,d,p))return false;
    if(S.reserves.some(x=>x.date==r.date&&x.period==p&&x.substituteId==t.id))return false;
    if(t.balance>=limitOf(t)+(em?3:0))return false;
    if(p==8&&p8Count(t)>=p8LimitOf(t)+(em?1:0))return false;
    if(dayCount(t,r.date)>=(t.type=='معلم أول'?st.dailyLimitSenior:st.dailyLimit)+(em?1:0))return false;
    if(!em&&st.noBetween&&(busy(t,d,p-1)||busy(t,d,p+1)))return false;
    if(!em&&st.noAfter3&&busy(t,d,p-1)&&busy(t,d,p-2)&&busy(t,d,p-3))return false;
    if(t.exFrom&&r.date>=t.exFrom&&r.date<=(t.exTo||t.exFrom))return false;
    if(t.noPeriods&&t.noPeriods.includes(p))return false;
    if(t.noDays&&t.noDays.includes(d))return false;
    if(st.noP8Senior&&p==8&&t.type=='معلم أول')return false;
    if(!em&&st.noConsec&&S.reserves.some(x=>x.date==r.date&&x.substituteId==t.id&&Math.abs(x.period-p)==1))return false;
    if(!em&&st.maxWeekly>0&&weekCount(t,r.date)>=st.maxWeekly)return false;
    if(st.onlyPresent&&!Object.keys(t.schedule[d]||{}).length)return false;
    if(st.excludeSubjects&&st.excludeSubjects.split(/[,،]/).map(x=>x.trim()).filter(Boolean).includes(t.subject))return false;
    if(!em&&st.maxGap>0&&gapOf(t,r)>st.maxGap)return false;
    if(!em&&st.maxRun>0){const occ=q=>busy(t,d,q)||S.reserves.some(x=>x.date==r.date&&x.substituteId==t.id&&x.period==q);let n=1,q=p-1;while(q>=1&&occ(q)){n++;q--;}q=p+1;while(q<=8&&occ(q)){n++;q++;}if(n>st.maxRun)return false;}
    return true;
  }).sort((a,b)=>{
    if(!!a.lastResort!=!!b.lastResort)return a.lastResort?1:-1;
    const ra=a.balance/limitOf(a)||0,rb=b.balance/limitOf(b)||0;
    if(st.nearFirst){
      const w=Math.max(1,st.nearBand||20),ba=Math.floor(ra*100/w),bb=Math.floor(rb*100/w);if(ba!=bb)return ba-bb;
      const ga=gapOf(a,r),gb=gapOf(b,r);if(ga!=gb)return ga-gb;}
    if(ra!=rb)return ra-rb;
    if(st.spread&&dayCount(a,r.date)!=dayCount(b,r.date))return dayCount(a,r.date)-dayCount(b,r.date);
    if(st.byLoad&&baseCount(a)!=baseCount(b))return baseCount(a)-baseCount(b);
    if(st.sameSubject!==false){const sa=a.subject==ab.subject?0:1,sb=b.subject==ab.subject?0:1;if(sa!=sb)return sa-sb;}
    if(st.gradeFirst){const g=String(r.className).split('/')[0],ga=knowsGrade(a,g)?0:1,gb=knowsGrade(b,g)?0:1;if(ga!=gb)return ga-gb;}
    if(st.knowsClass){const ka=knows(a,r.className)?0:1,kb=knows(b,r.className)?0:1;if(ka!=kb)return ka-kb;}
    return p==8&&st.balanceLast?p8Count(a)-p8Count(b):0;
  });
}
function assign(r){const c=candidates(r);if(!c.length)return false;r.substituteId=c[0].id;c[0].balance++;return true;}
function redistributeEmpty(d){let ok=0,fail=0;S.reserves.filter(r=>r.date==d&&!r.substituteId).forEach(r=>assign(r)?ok++:fail++);return{ok,fail};}
function createFor(t,d){const day=dayOf(d);
  Object.keys(t.schedule[day]||{}).forEach(p=>{
    if(!S.reserves.some(r=>r.date==d&&r.absentId==t.id&&r.period==p))
      S.reserves.push({date:d,day,period:+p,className:t.schedule[day][p],absentId:t.id,substituteId:null});});}
function distribute(){S.teachers.filter(t=>t.isAbsent).forEach(t=>createFor(t,date));
  const r=redistributeEmpty(date);save();render();
  toast(`تم توزيع ${r.ok} حصة`+(r.fail?` — تعذّر ${r.fail}`:''),r.fail?'warn':'ok');}
function toggleAbs(id){
  const t=T(id);t.isAbsent=!t.isAbsent;{const L=S.absentDays[date]=(S.absentDays[date]||[]).filter(x=>x!=id);if(t.isAbsent)L.push(id);}
  if(t.isAbsent){
    const mine=S.reserves.filter(r=>r.date==date&&r.substituteId==id);
    mine.forEach(r=>{r.substituteId=null;t.balance=Math.max(0,t.balance-1);});
    if(!S.absenceLog.some(x=>x.date==date&&x.teacherId==id))S.absenceLog.push({date,teacherId:id});
    createFor(t,date);
    const r=redistributeEmpty(date);

  }else{
    const rm=S.reserves.filter(r=>r.date==date&&r.absentId==id);
    rm.forEach(r=>{const s=T(r.substituteId);if(s)s.balance=Math.max(0,s.balance-1);});
    S.reserves=S.reserves.filter(r=>!(r.date==date&&r.absentId==id));
    toast(`عاد المعلم — حُذفت ${rm.length} حصة`);
  }
  save();render();
}
function setSub(i,v){const r=S.reserves[i],o=T(r.substituteId),n=v?T(v):null;
  if(n){const c=conflictOf(n,r);
    if(c.length&&!confirm('⚠️ تنبيه تعارض:\n'+c.join('\n')+'\n\nهل تريد التعيين اليدوي رغم ذلك؟')){render();return;}
    if(c.length)toast('عُيّن يدوياً مع وجود تعارض: '+c[0],'warn');else{const w=warnOf(n,r);if(w.length)toast('تنبيه: '+w.join(' • '),'warn');}}
  if(o)o.balance=Math.max(0,o.balance-1);if(n)n.balance++;r.substituteId=n?n.id:null;save();render();}
function conflictOf(t,r){const c=[];
  if(t.isAbsent)c.push('المعلم غائب');
  if(busy(t,r.day,r.period))c.push(`لديه حصة أساسية (${t.schedule[r.day][r.period]}) في الحصة ${r.period}`);
  if(t.lockedPeriods && t.lockedPeriods.includes(`${r.day}-${r.period}`))c.push(`الحصة ${r.period} يوم ${r.day} مغلقة (قيد إغلاق الحصص)`);
  const ri=r.i!==undefined?r.i:S.reserves.indexOf(r);
  if(S.reserves.some((x,j)=>j!==ri&&x.date==r.date&&x.period==r.period&&x.substituteId==t.id))c.push('لديه احتياط آخر في نفس الحصة');
  return c;}
function gapOf(t,r){const p=r.period,d=r.day,ri=r.i!==undefined?r.i:S.reserves.indexOf(r);let m=9;
  for(let q=1;q<=8;q++){if(q==p)continue;if(busy(t,d,q)||S.reserves.some((x,j)=>j!==ri&&x.date==r.date&&x.substituteId==t.id&&x.period==q))m=Math.min(m,Math.abs(q-p));}
  return m;}
function warnOf(t,r){const w=[],p=r.period,d=r.day,ri=r.i!==undefined?r.i:S.reserves.indexOf(r);
  const occ=q=>q>=1&&q<=8&&(busy(t,d,q)||S.reserves.some((x,j)=>j!==ri&&x.date==r.date&&x.substituteId==t.id&&x.period==q));
  const b=occ(p-1),a=occ(p+1);
  if(b&&a)w.push('محصورة بين حصتين');else if(b)w.push('بعد حصة مباشرة');else if(a)w.push('قبل حصة مباشرة');
  let n=1,q=p-1;while(occ(q)){n++;q--;}q=p+1;while(occ(q)){n++;q++;}
  if(n>=3)w.push(`ستصبح ${n} حصص متتالية`);
  return w;}
function delRes(i){const r=S.reserves[i],s=T(r.substituteId);if(s)s.balance=Math.max(0,s.balance-1);S.reserves.splice(i,1);save();render();}
function todayRes(){return S.reserves.map((r,i)=>({...r,i})).filter(r=>r.date==date).sort((a,b)=>a.absentId-b.absentId||a.period-b.period);}

/* ===== دوال حفظ واسترجاع الأنصبة المخصصة والحصص (JSON مخصص سريع) ===== */
function exportSchedules(){
  const data = {
    teachers: S.teachers.map(t => ({id: t.id, name: t.name, schedule: t.schedule, customLimit: t.customLimit, p8Limit: t.p8Limit, lockedPeriods: t.lockedPeriods})),
    exportedAt: new Date().toLocaleString('ar')
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'}));
  a.download = `أنصبة_وجداول_المسعى_${today()}.json`;
  a.click();
  toast('تم تنزيل ملف الأنصبة والجداول بنجاح');
}

function importSchedules(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if(!parsed.teachers || !Array.isArray(parsed.teachers)) throw new Error('ملف غير صالح');
      parsed.teachers.forEach(pt => {
        const t = S.teachers.find(x => x.id === pt.id || x.name === pt.name);
        if(t){
          if(pt.schedule) t.schedule = pt.schedule;
          if(pt.customLimit !== undefined) t.customLimit = pt.customLimit;
          if(pt.p8Limit !== undefined) t.p8Limit = pt.p8Limit;
          if(pt.lockedPeriods) t.lockedPeriods = pt.lockedPeriods;
        }
      });
      save();
      render();
      toast(`تم استعادة واستيراد جداول وأنصبة ${parsed.teachers.length} معلماً بنجاح!`);
    } catch(err) {
      toast('تعذّر استيراد الملف: تأكد أنه ملف أنصبة صالح', 'err');
    }
  };
  reader.readAsText(file);
}

function toggleTeacherCellLock(id, d, p){
  const t = T(id);
  if(!t.lockedPeriods) t.lockedPeriods = [];

  if(t.lockedPeriods.includes(key)){
    t.lockedPeriods = t.lockedPeriods.filter(x => x !== key);

  } else {
    t.lockedPeriods.push(key);
    toast(`تم إغلاق حصة يوم ${d} الحصة ${p} (منع الاحتياط فيها)`, 'warn');

}

function importRows(rows){
  rows=rows.map(r=>r.map(x=>String(x??'').trim())).filter(r=>r.some(Boolean));
  if(!rows.length)return 0;
  const h=rows[0],iN=h.indexOf('الاسم'),iD=h.indexOf('اليوم'),iP=h.indexOf('الحصة'),iC=h.indexOf('الصف');
  const nid=()=>Math.max(0,...S.teachers.map(t=>t.id))+1;let n=0;
  if(iN>=0&&iD>=0&&iP>=0&&iC>=0){
    rows.slice(1).forEach(r=>{const t=S.teachers.find(x=>x.name==r[iN]);if(!t||!DAYS.includes(r[iD])||!+r[iP])return;
      t.schedule[r[iD]]=t.schedule[r[iD]]||{};if(r[iC])t.schedule[r[iD]][+r[iP]]=r[iC];else delete t.schedule[r[iD]][+r[iP]];n++;});
    return n;}
  rows.forEach((c,i)=>{if(i==0&&c[0]=='الاسم')return;
    const hasS=c.slice(4,9).some(Boolean),sch={};
    DAYS.forEach((d,k)=>{sch[d]={};(c[4+k]||'').split(/\s+/).filter(Boolean).forEach(x=>{const[p,k2]=x.split(':');if(p&&k2)sch[d][+p]=k2;});});
    const ex=S.teachers.find(t=>t.name==c[0]);
    if(ex){if(c[1])ex.subject=c[1];if(c[2])ex.type=c[2];if(c[3])ex.phone=c[3];if(hasS)ex.schedule=sch;}
    else S.teachers.push({id:nid(),name:c[0],subject:c[1]||'غير محدد',type:c[2]||'معلم',phone:c[3]||'',schedule:hasS?sch:{},balance:0,isAbsent:false,exempt:false,customLimit:null,lockedPeriods:[]});
    n++;});
  return n;}

  const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});
    const n=importRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}));save();render();toast(`تمت معالجة ${n} سجل`,n?'ok':'warn');}
    catch(x){toast('تعذّرت قراءة الملف: '+x.message,'err');}};r.readAsArrayBuffer(f);}

let dTok=null,dTimer=null,dWarned=false;
const dH=()=>({Authorization:'Bearer '+dTok});
function driveQueue(){if(!S||!S.drive||!S.drive.auto)return;clearTimeout(dTimer);
  dTimer=setTimeout(()=>{if(dTok)driveSave(true);else if(!dWarned){dWarned=true;toast('الحفظ على Drive متوقف: اربط الحساب','warn');}},4000);}
function driveAuth(cb){if(!S.drive.clientId)return toast('أدخل Client ID أولاً','err');
  const go=()=>google.accounts.oauth2.initTokenClient({client_id:S.drive.clientId,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>{if(r.error)return toast('فشل: '+r.error,'err');dTok=r.access_token;dWarned=false;cb&&cb();}}).requestAccessToken();
  if(window.google&&google.accounts)return go();
  const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.onload=go;sc.onerror=()=>toast('تعذّر تحميل Google','err');document.head.appendChild(sc);}
function driveConnect(){driveAuth(()=>driveSave(false));}
async function driveFind(){const r=await fetch('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+encodeURIComponent("name='masaa-v3-backup.json' and trashed=false"),{headers:dH()});
  const j=await r.json();return j.files&&j.files[0]?j.files[0].id:'';}
async function driveSave(quiet){try{const d=S.drive;if(!d.fileId)d.fileId=await driveFind();
    const meta={name:'masaa-v3-backup.json'};if(!d.fileId&&d.folderId)meta.parents=[d.folderId];
    const bd='b'+Date.now(),body=`--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({...S,sb:undefined})}\r\n--${bd}--`;
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files'+(d.fileId?'/'+d.fileId:'')+'?uploadType=multipart',{method:d.fileId?'PATCH':'POST',headers:{...dH(),'Content-Type':'multipart/related; boundary='+bd},body});
    if(r.status==401){dTok=null;return quiet?toast('انتهت جلسة Drive','warn'):driveAuth(()=>driveSave(false));}
    if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();d.fileId=j.id;d.last=new Date().toLocaleString('ar');
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    if(!quiet){toast('☁️ تم الحفظ على Drive');render();}}catch(e){toast('فشل الحفظ على Drive: '+e.message,'err');}}
async function driveLoad(){if(!dTok)return driveAuth(driveLoad);
  try{const d=S.drive;if(!d.fileId)d.fileId=await driveFind();if(!d.fileId)return toast('لا توجد نسخة','warn');
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${d.fileId}?alt=media`,{headers:dH()});if(!r.ok)throw new Error('HTTP '+r.status);
    if(!confirm('سيتم استبدال بياناتك. متابعة؟'))return;
    const n=await r.json(),keep={clientId:d.clientId,fileId:d.fileId,folderId:d.folderId,auto:d.auto};
    localBackup('قبل الاسترجاع');const sbk=S.sb;S=n;S.sb=Object.assign({},defaults().sb,sbk);S.settings=Object.assign({},defaults().settings,S.settings);S.drive=Object.assign({},defaults().drive,S.drive,keep);
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}setTheme(S.theme||'light');toast('تم الاسترجاع');}catch(e){toast('فشل الاسترجاع: '+e.message,'err');}}

function notesOf(t,r){const n=[],st=S.settings,ri=r.i!==undefined?r.i:S.reserves.indexOf(r),p=r.period,lim=limitOf(t);
  if(st.noP1 && p === 1) n.push({k:'stop',t:'الحصة الأولى مغلقة عامّاً (لا يُوزع فيها احتياط)'});
  if(t.lockedPeriods && t.lockedPeriods.includes(`${r.day}-${p}`)) n.push({k:'stop',t:'الحصة مغلقة لهذا المعلم في هذا اليوم (قيد)'});
  conflictOf(t,r).forEach(x=>n.push({k:'stop',t:x}));
  warnOf(t,r).forEach(x=>n.push({k:'warn',t:x}));
  const after=t.balance+(r.substituteId==t.id?0:1);
  if(after>lim)n.push({k:'warn',t:`سيتجاوز نصابه: ${after} من ${lim}`});
  else if(after==lim)n.push({k:'info',t:`سيبلغ نصابه الكامل (${after}/${lim})`});
  else if(lim&&after/lim>=0.8)n.push({k:'info',t:`نصابه مرتفع: ${after} من ${lim}`});
  if(p==8){const l8=p8LimitOf(t),u8=p8Count(t)+(r.substituteId==t.id?0:1);if(u8>l8)n.push({k:'warn',t:`سيتجاوز نصاب الحصة 8: ${u8} من ${l8}`});else if(u8==l8)n.push({k:'info',t:`سيبلغ نصاب الحصة 8 (${u8}/${l8})`});}
  const dl=t.type=='معلم أول'?st.dailyLimitSenior:st.dailyLimit;
  if(S.reserves.filter((x,j)=>j!==ri&&x.date==r.date&&x.substituteId==t.id).length>=dl)n.push({k:'warn',t:`بلغ الحد اليومي (${dl})`});
  if(t.exempt)n.push({k:'warn',t:'معفى من الاحتياط'});
  if(t.exFrom&&r.date>=t.exFrom&&r.date<=(t.exTo||t.exFrom))n.push({k:'warn',t:`معفى مؤقتاً`});
  if((t.noPeriods||[]).includes(p))n.push({k:'warn',t:`الحصة ${p} ممنوعة عليه`});
  if((t.noDays||[]).includes(r.day))n.push({k:'warn',t:`يوم ${r.day} ممنوع عليه`});
  if(t.lastResort)n.push({k:'info',t:'مصنّف "آخر خيار"'});
  const g=gapOf(t,r);if(g==9)n.push({k:'info',t:'ليس لديه حصص أخرى في هذا اليوم'});else if(g>=4)n.push({k:'info',t:`بعيدة عن جدوله`});
  return n;}
const iconOf=n=>n.some(x=>x.k=='stop')?'🛑':n.some(x=>x.k=='warn')?'⚠️':'';
function rowWarn(r){const t=T(r.substituteId);if(!t)return '';const n=notesOf(t,r).filter(x=>x.k!='info'),ic=iconOf(n);if(!ic)return '';
  const f=n.find(x=>x.k=='stop')||n[0];
  return `<span class="tag" style="background:${ic=='🛑'?'var(--dan)':'var(--warn)'};color:#fff" title="${esc(n.map(x=>x.t).join(' | '))}">${ic} ${esc(f.t)}</span> `;}
let pickI=-1,pickQ='';
function pickSub(i){pickI=i;pickQ='';drawPick();}
function drawPick(keep){const r=S.reserves[pickI];if(!r)return;const cand=candidates(r).map(t=>t.id);
  const rows=S.teachers.filter(t=>!t.isAbsent&&t.id!=r.absentId&&(t.name+t.subject).includes(pickQ)).map(t=>{const n=notesOf(t,r);return{t,n,ic:iconOf(n)};})
    .map(x=>{x.ci=cand.indexOf(x.t.id);x.bad=x.n.filter(y=>y.k!='info').length;x.g=x.ci>=0?0:x.n.some(y=>y.k=='stop')?3:x.bad?2:1;return x;})
    .sort((a,b)=>a.g-b.g||(a.g==0?a.ci-b.ci:a.bad-b.bad||(a.t.balance/limitOf(a.t))-(b.t.balance/limitOf(b.t))));
  openModal(`<h3>اختيار بديل — الحصة ${r.period} (${esc(r.className)})</h3><div style="color:var(--mut)">الغائب: ${esc(T(r.absentId).name)}</div>
  <input id="pq" placeholder="🔍 بحث" value="${esc(pickQ)}" oninput="pickQ=this.value;drawPick(true)" style="width:100%;margin:8px 0">
  <div class="pk">${rows.map(({t,n,ic})=>{const top=n.filter(x=>x.k!='info').concat(n.filter(x=>x.k=='info')).slice(0,2);
    return `<div class="pr" onclick="pickChoose(${t.id})"><span class="pi">${ic||''}</span>
    <div class="pn"><b>${esc(t.name)}${t.id==r.substituteId?' ✓':''}</b><small>${esc(t.subject)}</small>${top.map(x=>`<small class="c-${x.k}">${esc(x.t)}</small>`).join('')}</div>
    <div class="pg"><div><b>${baseCount(t)}</b><small>حصصه</small></div><div><b>${limitOf(t)-t.balance}<i>/${limitOf(t)}</i></b><small>احتياط</small></div><div><b>${p8LimitOf(t)-p8Count(t)}<i>/${p8LimitOf(t)}</i></b><small>الأخيرة</small></div></div></div>`;}).join('')||'<p>لا نتائج</p>'}</div>
  <button class="btn o" onclick="applySub(${pickI},'')">بلا بديل</button><button class="btn o" onclick="closeModal()">إغلاق</button>`);
  if(keep){const e=$('pq');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}}}
function pickChoose(id){const t=T(id),r=S.reserves[pickI],n=notesOf(t,r),reg=regOf(t);
  if(!n.length&&!reg.length)return applySub(pickI,id);

  ${reg.length?`<b>القيود المسجلة:</b>${reg.map(x=>`<div class="nt">${esc(x)}</div>`).join('')}`:''}
  ${n.length?`<b>ملاحظات:</b>${n.map(x=>`<div class="nt ${x.k}">${esc(x.t)}</div>`).join('')}`:''}<br>
  <button class="btn ${stop?'d':'g'}" onclick="applySub(${pickI},${id})">${stop?'تعيين رغم التعارض':'تعيين'}</button><button class="btn o" onclick="drawPick()">رجوع</button>`);}
function applySub(i,id){const r=S.reserves[i],o=T(r.substituteId),n=id?T(id):null;
  if(o)o.balance=Math.max(0,o.balance-1);if(n)n.balance++;r.substituteId=n?n.id:null;save();closeModal();render();toast(n?'تم تعيين '+n.name:'أُزيل البديل');}

function statRows(){return S.teachers.map(t=>{const lim=limitOf(t),l8=p8LimitOf(t),took=t.balance,p8=p8Count(t),mine=S.reserves.filter(r=>r.absentId==t.id);
  return{name:t.name,subject:t.subject,load:baseCount(t),abs:absCount(t),cov:mine.length,covA:mine.filter(r=>r.substituteId).length,took,lim,pct:lim?Math.round(took/lim*100):0,p8,l8,p8pct:l8?Math.round(p8/l8*100):0,id:t.id};});}
const bar=p=>`<span style="color:${p>=100?'var(--dan)':p>=80?'var(--warn)':'var(--txt)'};font-weight:600">${p}%</span>`;
function statTable(rows,edit){const sum=k=>rows.reduce((a,x)=>a+x[k],0);
  const th=['الاسم','التخصص','الحصص الفعلية','أيام الغياب','حصص غيابه','الموزعة منها','الاحتياط','نصاب الاحتياط','النسبة','الحصة الأخيرة','نصابها','النسبة'];
  return `<table><tr>${th.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.subject)}</td><td>${x.load}</td><td>${x.abs}</td><td>${x.cov}</td><td>${x.covA}</td><td><b>${x.took}</b></td>
  <td>${edit?`<input type="number" style="width:56px" value="${x.lim}" onchange="setLimit(${x.id},this.value)">`:x.lim}</td><td>${bar(x.pct)}</td><td><b>${x.p8}</b></td>
  <td>${edit?`<input type="number" style="width:50px" value="${x.l8}" onchange="setP8(${x.id},this.value)">`:x.l8}</td><td>${bar(x.p8pct)}</td></tr>`).join('')}
  <tr style="font-weight:800"><td>الإجمالي</td><td></td><td>${sum('load')}</td><td>${sum('abs')}</td><td>${sum('cov')}</td><td>${sum('covA')}</td><td>${sum('took')}</td><td>${sum('lim')}</td><td></td><td>${sum('p8')}</td><td>${sum('l8')}</td><td></td></tr></table>`;}
R.stats=()=>`<div class="card"><b>${esc(S.cycle.name)}</b> — منذ ${esc(S.cycle.start)} <button class="btn o" onclick="xlStats(statRows(),S.cycle.name)">📊 Excel</button>
  <br><small style="color:var(--mut)">الحصص الفعلية = حصصه الأساسية أسبوعياً • حصص غيابه = حصص الاحتياط التي نشأت بسبب غيابه</small></div>

function xlStats(rows,name){if(typeof XLSX=='undefined')return toast('مكتبة Excel لم تُحمَّل','err');
  const h=['الاسم','التخصص','الحصص الفعلية','أيام الغياب','حصص غيابه','الموزعة منها','الاحتياط','نصاب الاحتياط','نسبة الاحتياط %','الحصة الأخيرة','نصاب الحصة الأخيرة','نسبتها %'];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([h,...rows.map(x=>[x.name,x.subject,x.load,x.abs,x.cov,x.covA,x.took,x.lim,x.pct,x.p8,x.l8,x.p8pct])]),'الإحصائيات');XLSX.writeFile(wb,'إحصائيات_'+name+'.xlsx');}
function cycleCard(){const cs=S.cycles||[],c=S.cycle||{};
  return `<div class="card"><h3>⚖️ الأنصبة والدورات</h3><p>الدورة الحالية: <b>${esc(c.name||'')}</b> — منذ ${esc(c.start||'')}</p>

function viewCycle(i){const c=S.cycles[i];openModal(`<h3>${esc(c.name)}</h3><div style="color:var(--mut)">${esc(c.start)} ← ${esc(c.end)}</div>${statTable(c.rows)}<br>

function delCycle(i){if(confirm('حذف هذه الدورة نهائياً؟')){S.cycles.splice(i,1);save();render();}}
function regOf(t){const g=[],st=S.settings;
  if(t.type=='معلم أول')g.push(`معلم أول: الحد اليومي ${st.dailyLimitSenior}`);
  if(t.customLimit!=null)g.push(`سقف احتياط مخصص: ${t.customLimit}`);
  if(t.p8Limit!=null)g.push(`سقف الحصة الأخيرة مخصص: ${t.p8Limit}`);
  if(t.exempt)g.push('معفى من الاحتياط');
  if(t.exFrom)g.push(`إعفاء مؤقت: ${t.exFrom} إلى ${t.exTo||t.exFrom}`);
  if((t.noPeriods||[]).length)g.push('حصص مغلقة/ممنوعة عامة: '+t.noPeriods.join('، '));
  if((t.noDays||[]).length)g.push('أيام ممنوعة: '+t.noDays.join('، '));
  if(t.lastResort)g.push('آخر خيار');
  return g;}

/* ===== النسخ الاحتياطية والمزامنة ===== */
function localBackup(label){try{const L=JSON.parse(localStorage.getItem(KEY+'-bk')||'[]');L.unshift({ts:new Date().toISOString(),label,data:S});localStorage.setItem(KEY+'-bk',JSON.stringify(L.slice(0,4)));}catch(e){}}
const hasWork=()=>S.reserves.length>0||S.cycles.length>0||S.teachers.some(t=>t.balance>0);
function applyData(d){const sbk=S.sb,dk=S.drive;S=d;S.sb=sbk;S.drive=Object.assign({},defaults().drive,dk);S.settings=Object.assign({},defaults().settings,S.settings);
  S.cycles=S.cycles||[];S.cycle=Object.assign({name:'الدورة 1',start:today()},S.cycle);S.absentDays=S.absentDays||{};absSync=null;save();render();}
function bkCard(){let L=[];try{L=JSON.parse(localStorage.getItem(KEY+'-bk')||'[]');}catch(e){}
  return `<div class="card"><h3>🛟 النسخ الاحتياطية</h3><p style="color:var(--mut)">تُحفظ نسخة من بياناتك على هذا الجهاز قبل أي استرجاع أو استيراد أو مسح، ونسخة يومية في Firebase (آخر 7 أيام).</p>
  <button class="btn" onclick="expJSON()">⬇️ تنزيل نسخة الآن</button><button class="btn o" onclick="sbBkList()">☁️ نسخ Firebase اليومية</button>
  ${L.length?`<table>${L.map((x,i)=>`<tr><td>${new Date(x.ts).toLocaleString('ar')}</td><td>${esc(x.label)} — ${x.data.teachers.length} معلم، ${x.data.reserves.length} حصة احتياط</td><td><button class="btn o" onclick="restoreBk(${i})">استعادة</button></td></tr>`).join('')}</table>`:'<small>لا نسخ محلية بعد</small>'}</div>`;}
function restoreBk(i){const x=JSON.parse(localStorage.getItem(KEY+'-bk')||'[]')[i];if(!x||!confirm('استعادة هذه النسخة؟ ستُحفظ بياناتك الحالية كنسخة احتياطية أولاً.'))return;
  localBackup('قبل الاستعادة');applyData(x.data);toast('تمت الاستعادة');}
function chipInfo(){const b=S.sb;if(!b||!b.url||!b.key)return null;
  if(b.unsynced&&!sbReady())return['⚠️ غير محفوظ في السحابة — اضغط للدخول','var(--dan)'];
  if(b.unsynced)return['⏳ جارٍ الحفظ في السحابة…','var(--warn)'];
  return['☁️ محفوظ في السحابة','var(--suc)'];}
function sbChip(){const c=chipInfo();return c?`<div id="sbchip" onclick="sbSync()" style="margin:0 8px 12px;padding:6px 12px;border-radius:12px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;background:${c[1]}">${c[0]}</div>`:'';}
function setChip(){const e=$('sbchip'),c=chipInfo();if(e&&c){e.textContent=c[0];e.style.background=c[1];}}
function sbSync(){if(sbReady())sbSave(false);else sbLogin();}

/* ===== Firebase ===== */
const FB_DEFAULT={projectId:'ahmed-d654f',apiKey:'AIzaSyCVGDzEAhrIge5lEZgXTQf2-GlBZHM1OKo'};

let fbTok=null,fbExp=0,sbTimer=null,sbDirty=false,sbSync_=false;
const fbPid=()=>S.sb.url,fbKey=()=>S.sb.key;
const fbDocs=()=>`https://firestore.googleapis.com/v1/projects/${fbPid()}/databases/(default)/documents`;
const sbReady=()=>!!(S.sb&&S.sb.url&&S.sb.key);
function sbPersist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
async function fbAuth(){
  if(fbTok&&Date.now()<fbExp-60000)return fbTok;
  try{let r,j;
    if(S.sb.refresh){r=await fetch('https://securetoken.googleapis.com/v1/token?key='+fbKey(),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(S.sb.refresh)});j=await r.json();
      if(r.ok){fbTok=j.id_token;S.sb.refresh=j.refresh_token;fbExp=Date.now()+(+j.expires_in)*1000;sbPersist();return fbTok;}}
    r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+fbKey(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});j=await r.json();
    if(r.ok){fbTok=j.idToken;S.sb.refresh=j.refreshToken;fbExp=Date.now()+(+j.expiresIn)*1000;sbPersist();return fbTok;}
  }catch(e){}
  return fbTok=null;
}
async function fbF(path,opt={}){const t=await fbAuth(),h={'Content-Type':'application/json'};if(t)h.Authorization='Bearer '+t;
  return fetch(fbDocs()+path+(path.includes('?')?'&':'?')+'key='+fbKey(),{...opt,headers:h});}
const fbName=id=>`projects/${fbPid()}/databases/(default)/documents/masaa_state/`+id;
async function fbGetMeta(id){const r=await fbF('/masaa_state/'+encodeURIComponent(id));if(r.status==404)return null;if(!r.ok)throw new Error('HTTP '+r.status);
  const f=(await r.json()).fields||{};return{parts:+((f.parts&&f.parts.integerValue)||0),updated_at:f.updated_at&&f.updated_at.stringValue};}
async function fbGet(id){const m=await fbGetMeta(id);if(!m)return null;
  const ps=await Promise.all(Array.from({length:m.parts},(_,i)=>fbF('/masaa_state/'+encodeURIComponent(id+'__p'+i)).then(r=>r.json()).then(j=>j.fields.json.stringValue)));
  return{data:JSON.parse(ps.join('')),updated_at:m.updated_at};}
async function fbPut(id,obj,ts){const js=JSON.stringify(obj),parts=[];for(let i=0;i<js.length;i+=250000)parts.push(js.slice(i,i+250000));if(!parts.length)parts.push('');
  let old=0;try{const m=await fbGetMeta(id);old=m?m.parts:0;}catch(e){}
  const w=parts.map((p,i)=>({update:{name:fbName(id+'__p'+i),fields:{json:{stringValue:p}}}}));
  for(let i=parts.length;i<old;i++)w.push({delete:fbName(id+'__p'+i)});
  w.push({update:{name:fbName(id),fields:{parts:{integerValue:String(parts.length)},updated_at:{stringValue:ts}}}});
  const r=await fbF(':commit',{method:'POST',body:JSON.stringify({writes:w})});if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,140));}
function sbQueue(){if(!S||!S.sb||!S.sb.auto||!S.sb.url)return;S.sb.unsynced=true;setChip();sbDirty=true;clearTimeout(sbTimer);sbTimer=setTimeout(()=>sbSave(true),3000);}
async function sbSave(quiet){try{if(!sbReady())throw new Error('أدخل Project ID ومفتاح API');if(!S.teachers.length)throw new Error('لا يوجد معلمون');
    const ts=new Date().toISOString();await sbSnap();const{sb,drive,...rest}=S;await fbPut(S.sb.rowId||'main',rest,ts);
    S.sb.rev=ts;sbDirty=false;S.sb.unsynced=false;setChip();S.sb.last=new Date().toLocaleString('ar');sbPersist();if(!quiet){toast('🔥 تم الحفظ في Firebase');render();}}
  catch(e){toast('فشل الحفظ في Firebase: '+e.message,'err');}}
async function sbApply(d,ts){localBackup('قبل تحميل نسخة السحابة');const sbk=S.sb,dk=S.drive;S=d;S.sb=sbk;S.drive=Object.assign({},defaults().drive,dk);S.settings=Object.assign({},defaults().settings,S.settings);
  S.cycles=S.cycles||[];S.cycle=Object.assign({name:'الدورة 1',start:today()},S.cycle);S.absentDays=S.absentDays||{};S.lastToday=S.lastToday||today();
  S.sb.rev=ts;S.sb.unsynced=false;absSync=null;sbPersist();document.documentElement.dataset.th=S.theme||'light';render();}
async function sbPull(){const b=S.sb;if(!sbReady()||sbDirty)return;
  try{const id=b.rowId||'main',m=await fbGetMeta(id);if(!m)return sbSave(true);
    if(b.rev&&new Date(m.updated_at)<=new Date(b.rev))return;
    if($('modal').innerHTML)return;
    if(!b.rev&&hasWork()&&!confirm('توجد نسخة على السحابة. هل تحمّلها على هذا الجهاز؟ سيُحفظ نسخة من بياناتك الحالية أولاً.')){b.rev=m.updated_at;sbPersist();return;}
    const g=await fbGet(id);if(g){sbApply(g.data,g.updated_at);toast('☁️ تم تحميل آخر نسخة من السحابة');}}catch(e){}}
async function sbBoot(){if(!S.sb||!sbReady()||!S.sb.auto)return;await fbAuth();await sbPull();setInterval(()=>{if(!document.hidden)sbPull();},60000);}
async function sbLoad(){if(!sbReady())return toast('أدخل Project ID ومفتاح API أولاً','warn');
  try{const g=await fbGet(S.sb.rowId||'main');if(!g)return toast('لا توجد نسخة محفوظة','warn');
    if(!confirm('سيتم استبدال بياناتك الحالية بنسخة Firebase. متابعة؟'))return;
    sbApply(g.data,g.updated_at);save();toast('تم الاسترجاع');}catch(e){toast('فشل الاسترجاع: '+e.message,'err');}}
function sbLogin(){return sbSave(false);}
function sbSync(){return sbSave(false);}
function sbLink(){const b=S.sb,p={u:b.url,k:b.key,r:b.rowId};
  const link=location.href.split('#')[0]+'#sb='+btoa(unescape(encodeURIComponent(JSON.stringify(p))));
  (navigator.clipboard?navigator.clipboard.writeText(link).then(()=>toast('نُسخ رابط الربط')):Promise.reject()).catch(()=>prompt('انسخ هذا الرابط',link));}
function sbHash(){try{let c=null;
  if(location.hash.startsWith('#sb=')){const p=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(4)))));c={url:p.u,key:p.k,rowId:p.r||'main'};history.replaceState(null,'',location.pathname+location.search);}
  else if(!S.sb.url&&FB_DEFAULT.projectId)c={url:FB_DEFAULT.projectId,key:FB_DEFAULT.apiKey};
  if(c){Object.assign(S.sb,c,{auto:true,rev:'',refresh:''});sbPersist();toast('تم إعداد الاتصال بـ Firebase تلقائياً');}}catch(e){}}
async function sbSnap(){const b=S.sb;if(b.bkDay===today())return;
  try{const id=b.rowId||'main',cur=await fbGet(id);
    if(cur&&(cur.data.teachers||[]).length){await fbPut(id+'-bk-'+today(),cur.data,new Date().toISOString());
      const old=id+'-bk-'+new Date(Date.now()-8*864e5).toISOString().slice(0,10),j=await (await fbF('/masaa_state?pageSize=300')).json();
      const del=(j.documents||[]).map(d=>d.name).filter(n=>{const k=decodeURIComponent(n.split('/masaa_state/')[1]).split('__p')[0];return k.startsWith(id+'-bk-')&&k<old;});
      if(del.length)await fbF(':commit',{method:'POST',body:JSON.stringify({writes:del.map(n=>({delete:n}))})});}
    b.bkDay=today();}catch(e){}}
async function sbBkList(){if(!sbReady())return toast('أدخل Project ID ومفتاح API أولاً','warn');
  try{const id=S.sb.rowId||'main',j=await (await fbF('/masaa_state?pageSize=300')).json();
    const L=(j.documents||[]).map(d=>({id:decodeURIComponent(d.name.split('/masaa_state/')[1]),u:d.fields&&d.fields.updated_at&&d.fields.updated_at.stringValue})).filter(x=>x.id.startsWith(id+'-bk-')&&!x.id.includes('__p')).sort((a,b)=>b.id<a.id?-1:1);
    openModal(`<h3>نسخ Firebase اليومية</h3>${L.length?L.map(x=>`<div class="pr" onclick="sbRestoreBk('${x.id}')"><div class="pn"><b>${esc(x.id.split('-bk-')[1])}</b><small>${x.u?new Date(x.u).toLocaleString('ar'):''}</small></div><span>استرجاع ↩</span></div>`).join(''):'<p>لا نسخ يومية بعد (تبدأ مع أول حفظ).</p>'}<br><button class="btn o" onclick="closeModal()">إغلاق</button>`);}catch(e){toast('فشل: '+e.message,'err');}}
async function sbRestoreBk(id){try{const g=await fbGet(id);if(!g||!confirm('استرجاع نسخة '+id.split('-bk-')[1]+'؟ ستُحفظ بياناتك الحالية أولاً.'))return;
  closeModal();localBackup('قبل استرجاع نسخة يومية');applyData(g.data);toast('تم الاسترجاع');}catch(e){toast('فشل: '+e.message,'err');}}

/* ===== INIT ===== */
window.onerror=(m,s,l)=>{if(/^Script error/i.test(String(m))&&!l){console.warn('تم تجاهل خطأ خارجي:',m);return true;}toast('خطأ: '+m+' (سطر '+l+')','err');};
try{load();clsP=currentPeriod()||1;document.documentElement.dataset.th=S.theme||'light';render();sbHash();sbBoot();}
catch(e){document.body.innerHTML='<div style="padding:30px;font-family:sans-serif">تعذّر تشغيل المنصة: '+e.message+'</div>';}
</script>
